[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-guardrails"
dynamic = ["version"]
description = "Project rules for AI coding agents (Claude Code, Codex CLI, Antigravity): MCP server, AGENTS.md bootstrap, AST checks, pre-commit hook and CI gate"

readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Aegis Contributors"}
]
keywords = [
    "ai-coding-agents", "ai-guardrails", "coding-agents", "guardrails", "mcp", "mcp-server",
    "model-context-protocol", "agents-md", "claude-md", "claude-code", "claude-code-hooks",
    "codex-cli", "antigravity", "pre-commit", "git-hooks", "code-review", "static-analysis", "ast",
    "secret-scanning", "llm-guardrails", "agentic-coding"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
aegis = "aegis_cli.cli:main"
aegis-mcp = "aegis_mcp.server:main"
# The same server under the distribution name, for `uvx aegis-guardrails` and the MCP Registry.
aegis-guardrails = "aegis_mcp.server:main"

[project.optional-dependencies]
# Layer 2 runs any model through --llm-cmd / AEGIS_LLM_CMD, so there are no
# vendor SDK extras. Runtime dependencies stay empty.
dev = ["pytest", "pytest-xdist>=3.5.0", "ruff", "hypothesis>=6.168.5", "coverage", "pyyaml", "anyio", "build"]

[project.urls]
Homepage = "https://github.com/nseney1/Aegis-Guardrails"
Documentation = "https://github.com/nseney1/Aegis-Guardrails/blob/main/docs/how-it-works.md"
Changelog = "https://github.com/nseney1/Aegis-Guardrails/blob/main/CHANGELOG.md"
Source = "https://github.com/nseney1/Aegis-Guardrails"
Issues = "https://github.com/nseney1/Aegis-Guardrails/issues"
Security = "https://github.com/nseney1/Aegis-Guardrails/blob/main/SECURITY.md"
"Release Notes" = "https://github.com/nseney1/Aegis-Guardrails/blob/main/CHANGELOG.md"



[tool.setuptools]
include-package-data = true
# Listed, not found: package-dir below maps the repository's rules/ and skills/ into
# aegis_core/_data/, so the wheel installs no top-level `rules` or `skills` package
# (one would overwrite another distribution's, or be shadowed by a repository's own).
# tests/unit/cli/test_install_package_data.py fails when a package is missing here.
packages = [
    "aegis_cli",
    "aegis_cli.formatters",
    "aegis_cli.hooks",
    "aegis_cli.ui",
    "aegis_core",
    "aegis_core._data.rules",
    "aegis_core._data.skills",
    "aegis_core.ast",
    "aegis_core.ast.drivers",
    "aegis_core.ast.drivers.js",
    "aegis_core.ast.drivers.templates",
    "aegis_core.command_safety",
    "aegis_core.insights",
    "aegis_core.lifecycle",
    "aegis_core.outcomes",
    "aegis_core.skills",
    "aegis_core.telemetry_engine",
    "aegis_core.verification",
    "aegis_core.workspace",
    "aegis_core.yaml_engine",
    "aegis_mcp",
    "aegis_mcp.handlers",
    "aegis_sdk",
]

[tool.setuptools.package-dir]
"aegis_core._data.rules" = "rules"
"aegis_core._data.skills" = "skills"

[tool.setuptools.dynamic]
# The one version source (D18). setuptools reads the assignment without importing aegis_core.
version = {attr = "aegis_core._version.__version__"}

[tool.setuptools.package-data]
aegis_sdk = ["py.typed"]
aegis_core = [
    "ast/drivers/templates/go_ast.go",
    "ast/drivers/templates/go.mod",
    "ast/drivers/templates/rust_ast.py",
    "benchmark_corpus/corpus.json",
    "benchmark_corpus/ast.json",
]
"aegis_core._data.rules" = ["*.md", ".oracles/*.md"]
"aegis_core._data.skills" = ["*/SKILL.md"]


[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
# Dumps every thread's stack when a test hangs this long; it does not abort the run.
faulthandler_timeout = 300
# pytest < 9 silently skips an async test when no async plugin is installed;
# make that an error so a missing plugin can't hide tests on CI again.
# Matched by message: pytest 9 removed the warning class (it fails instead).
filterwarnings = ["error:async def functions are not natively supported"]
markers = ["timing: asserts on elapsed time; never deselect it"]
