name: Publish to PyPI

# No workflow_dispatch: a dispatch runs the chosen ref's own copy of this file, so no guard here
# binds it. Recover with "Re-run failed jobs" or a new release; PyPI filenames are immutable.
on:
  release:
    types: [published]

# Least privilege: every job gets a read-only token unless it grants more below.
permissions:
  contents: read

# A second run for the same tag waits for the first instead of racing its upload.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag is v + package version, at this commit
        run: python3 .github/scripts/release_guard.py

  validate:
    needs: guard
    uses: ./.github/workflows/validate.yml
    # A reusable workflow can never exceed its caller's grants; the build job
    # inside needs these to sign build provenance attestations.
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish:
    needs: validate
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): PyPI trusts this repo + workflow + environment,
    # so no long-lived API token exists. id-token is only for the upload step.
    environment:
      name: pypi
      url: https://pypi.org/p/aegis-guardrails
    permissions:

      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Never rebuild here: download the artifact that the validate jobs
      # verified, installed and smoke-tested in this same workflow run.
      - name: Download validated artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aegis-wheel
          path: dist/

      # No pipe: a failed verify must fail this step (a `| tee` would mask the
      # exit code under the default non-pipefail shell and publish a partial list).
      - name: Verify artifact digests and contents
        shell: bash
        run: |
          python .github/scripts/verify_dist.py verify dist > publish-files.txt
          cat publish-files.txt

      # A re-run must never change or mask PyPI content (so no skip-existing): keep only the
      # files PyPI lacks, skip the upload when it holds them all, fail on a digest mismatch
      # or an unreadable answer. guard proved the tag is v + the package version.
      - name: Compare with what PyPI holds
        id: pypi
        shell: bash
        run: |
          python .github/scripts/pypi_state.py plan --project aegis-guardrails --version "${GITHUB_REF_NAME#v}" --sums dist/SHA256SUMS --files publish-files.txt
          cat publish-files.txt

      # The publish action uploads every file in packages-dir, and dist/ also
      # holds SHA256SUMS. Stage exactly the verified files listed above.
      - name: Stage verified files for upload
        if: steps.pypi.outputs.state != 'identical'
        shell: bash
        run: |
          set -euo pipefail
          mkdir publish-dist
          while IFS= read -r f; do
            cp -- "$f" publish-dist/
          done < publish-files.txt
          test "$(ls publish-dist | wc -l)" -eq "$(wc -l < publish-files.txt)"
          ls -l publish-dist

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.pypi.outputs.state != 'identical'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/

      - name: Wait until PyPI holds exactly the verified files
        shell: bash
        run: python .github/scripts/pypi_state.py wait --project aegis-guardrails --version "${GITHUB_REF_NAME#v}" --sums dist/SHA256SUMS

  release-assets:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aegis-wheel
          path: publish-dist/

      - name: Attach artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" publish-dist/* --clobber
