            --audit "$AEGIS_SOURCE_AUDIT" --tree "$TREE" \
            --evidence "$RUNNER_TEMP/aegis-language-preparation-$AEGIS_PYTHON_LEG" \
            --require-platform win32 --github-output "$GITHUB_OUTPUT" "${OWNER_ARGS[@]}"

      - name: Verify real Go CLI cache and generated hooks
        env:
          AEGIS_LANGUAGE_SOURCE: ${{ steps.language-source.outputs.source }}
          AEGIS_LANGUAGE_AUDIT: ${{ steps.language-source.outputs.audit }}
          AEGIS_LANGUAGE_TREE: ${{ steps.language-source.outputs.tree }}
          AEGIS_GO_EXECUTABLE: ${{ steps.language-source.outputs.go }}
          AEGIS_GIT_EXECUTABLE: ${{ steps.language-source.outputs.git }}
          AEGIS_BASH_EXECUTABLE: ${{ steps.language-source.outputs.bash }}
          AEGIS_OWNER_HELPER: ${{ steps.language-source.outputs.owner }}
          AEGIS_PYTHON_LEG: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          python -I -S -B "$AEGIS_LANGUAGE_SOURCE/.github/fixtures/go-functional/acceptance.py" \
            --source "$AEGIS_LANGUAGE_SOURCE" \
            --audit "$AEGIS_LANGUAGE_AUDIT" --tree "$AEGIS_LANGUAGE_TREE" \
            --go "$AEGIS_GO_EXECUTABLE" --git "$AEGIS_GIT_EXECUTABLE" --bash "$AEGIS_BASH_EXECUTABLE" \
            --ownership-helper "$AEGIS_OWNER_HELPER" \
            --evidence "$RUNNER_TEMP/aegis-go-functional-$AEGIS_PYTHON_LEG" \
            --require-platform win32 --mode acceptance --root-inspected

      - name: Verify junction creation with a restricted effective token
        env:
          AEGIS_LANGUAGE_SOURCE: ${{ steps.language-source.outputs.source }}
          AEGIS_LANGUAGE_AUDIT: ${{ steps.language-source.outputs.audit }}
          AEGIS_LANGUAGE_TREE: ${{ steps.language-source.outputs.tree }}
          AEGIS_SOURCE_RECEIPT: ${{ steps.language-source.outputs.receipt }}
          AEGIS_RECEIPT_SHA256: ${{ steps.language-source.outputs.receipt_sha256 }}
          AEGIS_OWNER_HELPER: ${{ steps.language-source.outputs.owner }}
          AEGIS_PYTHON_LEG: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          python -I -S -B "$AEGIS_LANGUAGE_SOURCE/.github/scripts/p6_noadmin.py" \
            --source "$AEGIS_LANGUAGE_SOURCE" --owner-helper "$AEGIS_OWNER_HELPER" \
            --source-receipt "$AEGIS_SOURCE_RECEIPT" --expected-receipt-sha256 "$AEGIS_RECEIPT_SHA256" \
            --expected-audit "$AEGIS_LANGUAGE_AUDIT" --expected-tree "$AEGIS_LANGUAGE_TREE" \
            --evidence "$RUNNER_TEMP/aegis-p6-noadmin-$AEGIS_PYTHON_LEG"

      - name: Curate Go and P6 acceptance JSON and logs
        if: always()
        env:
          AEGIS_PYTHON_LEG: ${{ matrix.python-version }}
        run: |
          python -I -S -B - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          leg = os.environ["AEGIS_PYTHON_LEG"]
          output = root / ("aegis-go-curated-" + leg)
          output.mkdir()
          files, hooks, absent = {}, {}, []
          for prefix in ("aegis-language-preparation-", "aegis-go-functional-", "aegis-p6-noadmin-"):
              source = root / (prefix + leg)
              if not source.is_dir():
                  absent.append(source.name)
                  continue
              target = output / source.name
              target.mkdir()
              for path in sorted(source.iterdir()):
                  if not path.is_file() or path.is_symlink():
                      continue
                  key = str(path.relative_to(root)).replace("\\", "/")
                  if path.suffix in (".json", ".jsonl", ".log"):
                      copied = target / path.name
                      shutil.copy2(path, copied)
                      files[str(copied.relative_to(output)).replace("\\", "/")] = {
                          "sha256": hashlib.sha256(copied.read_bytes()).hexdigest(),
                          "bytes": copied.stat().st_size}
                  elif path.name.endswith("-generated-hook.sh"):
                      hooks[key] = {"sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                                    "text": path.read_text(encoding="utf-8")}
          payload = output / "generated-hooks.json"
          payload.write_text(json.dumps(hooks, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          files[payload.name] = {"sha256": hashlib.sha256(payload.read_bytes()).hexdigest(),
                                "bytes": payload.stat().st_size}
          manifest = {"status": "CURATED_ONLY", "files": files, "absent_directories": absent,
                      "excludes": ["source checkout", "venv", "fixture repositories", "compiler caches",
                                   "executable payloads"],
                      "scope": "Curation is not acceptance; inspect the preserved execution and preparation statuses."}
          (output / "curated-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n",
                                                        encoding="utf-8")
          PY

      - name: Preserve Go and P6 acceptance JSON and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegis-go-windows-${{ matrix.python-version }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/aegis-go-curated-${{ matrix.python-version }}/

      # AC24 (owner decision A, 2026-11-02): the owner approved this pinned, locked network
      # acquisition of the unchanged M0 fixture as an exception to the no-download and cap rules.
      # ac24_acquire.py allows only npm ci --ignore-scripts from registry.npmjs.org with SHA512
      # integrity, a 600 s bound and 0 retries. Both scripts refuse a dirty or mismatched tree,
      # so they run on the shared clean source rather than the test-suite workspace.
      - name: Record existing Node for AC24 acceptance
        env:
          AEGIS_PYTHON_LEG: ${{ matrix.python-version }}
        run: |
          python -I -S - "$RUNNER_TEMP/aegis-ac24-tools-$AEGIS_PYTHON_LEG.json" <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, sys
          result = {"platform": sys.platform, "python": sys.version, "tools": {}}
          env = dict(os.environ)
          env.pop("NODE_OPTIONS", None)
          for name, flag in (("node", "--version"),):
              found = shutil.which(name)
              row = {"available": found is not None}
              if found:
                  path = pathlib.Path(found).resolve()
                  done = subprocess.run([str(path), flag], cwd=os.environ["RUNNER_TEMP"], env=env,
                                        capture_output=True, text=True, timeout=10)
                  row.update(path=str(path), sha256=hashlib.sha256(path.read_bytes()).hexdigest(),
                             exit=done.returncode, stdout=done.stdout, stderr=done.stderr)
              result["tools"][name] = row
          pathlib.Path(sys.argv[1]).write_text(json.dumps(result, indent=2), encoding="utf-8")
          print(json.dumps(result, indent=2))
          PY

      - name: Acquire the complete locked M0 Windows test fixture
        env:
          AEGIS_LANGUAGE_SOURCE: ${{ steps.language-source.outputs.source }}
          AEGIS_PYTHON_LEG: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          python -I -S -B "$AEGIS_LANGUAGE_SOURCE/.github/scripts/ac24_acquire.py" \
            --source "$AEGIS_LANGUAGE_SOURCE" --kit "$AEGIS_LANGUAGE_SOURCE/.github/fixtures/ac24" \
            --root "$RUNNER_TEMP/aegis-ac24-acquisition-$AEGIS_PYTHON_LEG" \
            --execute-locked-acquisition

      - name: Verify real Vitest Windows snapshot junction
        env:
          AEGIS_LANGUAGE_SOURCE: ${{ steps.language-source.outputs.source }}
          AEGIS_LANGUAGE_AUDIT: ${{ steps.language-source.outputs.audit }}
          AEGIS_LANGUAGE_TREE: ${{ steps.language-source.outputs.tree }}
          AEGIS_PYTHON_LEG: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          AC24_KIT="$AEGIS_LANGUAGE_SOURCE/.github/fixtures/ac24"
          AC24_ROOT="$RUNNER_TEMP/aegis-ac24-acquisition-$AEGIS_PYTHON_LEG"
          AC24_NODE="$(python -I -S -c 'import json,pathlib,sys; r=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert r["status"]=="PASS", "M0 acquisition failed"; print(r["tools"]["node"])' "$AC24_ROOT/execution.json")"
          python -I -S -B "$AC24_KIT/acceptance.py" \
            --source "$AEGIS_LANGUAGE_SOURCE" --expected-audit "$AEGIS_LANGUAGE_AUDIT" \
            --expected-tree "$AEGIS_LANGUAGE_TREE" \
            --node "$AC24_NODE" --node-modules "$AC24_ROOT/project/node_modules" \
            --fixture "$AC24_KIT/fixture" --package-lock "$AC24_KIT/m0-package-lock.json" \
            --evidence "$RUNNER_TEMP/aegis-ac24-evidence-$AEGIS_PYTHON_LEG" \
            --require-platform win32 --require-link junction

      - name: Preserve AC24 acquisition and acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegis-ac24-windows-${{ matrix.python-version }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/aegis-ac24-tools-${{ matrix.python-version }}.json
            ${{ runner.temp }}/aegis-ac24-acquisition-${{ matrix.python-version }}/*.json
            ${{ runner.temp }}/aegis-ac24-acquisition-${{ matrix.python-version }}/node-identity/*.json
            ${{ runner.temp }}/aegis-ac24-acquisition-${{ matrix.python-version }}/node-identity/*.log
            ${{ runner.temp }}/aegis-ac24-acquisition-${{ matrix.python-version }}/npm-identity/*.json
            ${{ runner.temp }}/aegis-ac24-acquisition-${{ matrix.python-version }}/npm-identity/*.log
            ${{ runner.temp }}/aegis-ac24-acquisition-${{ matrix.python-version }}/npm-ci/*.json
            ${{ runner.temp }}/aegis-ac24-acquisition-${{ matrix.python-version }}/npm-ci/*.log
            ${{ runner.temp }}/aegis-ac24-evidence-${{ matrix.python-version }}/*.json
            ${{ runner.temp }}/aegis-ac24-evidence-${{ matrix.python-version }}/*.log
            ${{ runner.temp }}/aegis-ac24-evidence-${{ matrix.python-version }}/*.xml

  # The CI verdict (v4.3 T2): attests sha256 of "aegis-ci-verdict/v1\ncommit <sha>\ntree <tree>\n"
  # once every job passed, only on the events doctor --release consumes (not release, not PRs).
  verdict:
    needs: [dependency-audit, build-wheel, aegis-check, validate, test-windows-unit-core-a, test-windows-unit-core-b, test-windows-unit-rest, test-windows-integration, test-windows-contract, test-windows-language, test-fast-unit-core, test-fast-unit-rest, test-fast-integration, test-fast-contract]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the subject (derivable from the commit alone) and the predicate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'aegis-ci-verdict/v1\ncommit %s\ntree %s\n' "$GITHUB_SHA" "$tree" > subject.txt
          python3 - "$tree" > predicate.json <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          assert needs and all(v["result"] == "success" for v in needs.values()), needs
          print(json.dumps({"commit": os.environ["GITHUB_SHA"], "tree": sys.argv[1],
                            "run": f'{os.environ["GITHUB_RUN_ID"]}/{os.environ["GITHUB_RUN_ATTEMPT"]}',
                            "jobs": {k: v["result"] for k, v in sorted(needs.items())}}))
          PY
      - name: Attest the verdict
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: subject.txt
          # permanent: attestations already issued carry this URI; change it only in a release that accepts both
          predicate-type: https://aegis.example/predicate/ci-verdict/v1
          predicate-path: predicate.json
