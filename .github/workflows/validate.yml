  aegis-check:
    needs: [dependency-audit, build-wheel, validate, test-windows-unit-core-a, test-windows-unit-core-b, test-windows-unit-rest, test-windows-integration, test-windows-contract, test-windows-language, test-fast-unit-core, test-fast-unit-rest, test-fast-integration, test-fast-contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # pull-requests: read lets check --ci read the reviews of a pull request (tier A approval).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify upstream jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_RESULT: ${{ github.event_name == 'pull_request' && github.base_ref == 'develop' && 'skipped' || 'success' }}
          # Jobs that run on every event, wave PRs included, so they must always succeed.
          ALWAYS_SUCCESS: test-fast-unit-core test-fast-unit-rest test-fast-integration test-fast-contract
          REQUIRED_WINDOWS: test-windows-unit-core-a test-windows-unit-core-b test-windows-unit-rest test-windows-integration test-windows-contract test-windows-language
        run: |
          python3 -c 'import json, os, sys; needs = json.loads(os.environ["NEEDS_JSON"]); expected = os.environ["EXPECTED_RESULT"]; always = os.environ["ALWAYS_SUCCESS"].split(); bad = {k: v.get("result") for k, v in needs.items() if v.get("result") != ("success" if k in always else expected)}; bad.update({k: "missing" for k in always + os.environ["REQUIRED_WINDOWS"].split() if k not in needs}); sys.exit(f"Unexpected upstream job results (expected {expected}, and success for {always}): {bad}" if bad else 0)'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch wave pull request head as data
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
      # On a wave PR the tests run in the test-fast shards (gated by the first step). This unconditional,
      # base-sourced comparison keeps the governance verdict free of the wave's own code.
      - name: Run CI governance without execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m aegis_cli.cli check --ci --no-exec
      - name: Set up Python
        if: github.event_name != 'pull_request' || github.base_ref != 'develop'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Download wheel artifact
        if: github.event_name != 'pull_request' || github.base_ref != 'develop'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aegis-wheel
          path: dist/
      - name: Verify artifact digests
        if: github.event_name != 'pull_request' || github.base_ref != 'develop'
        run: python .github/scripts/verify_dist.py verify dist
      # Same text as the other test jobs (a workflow test compares them): check --ci reruns the
      # head commit's trailer snapshot here, which must collect what those jobs collect.
      - name: Install test dependencies
        if: github.event_name != 'pull_request' || github.base_ref != 'develop'
        run: |
          pip install pytest==8.3.4 pytest-xdist==3.6.1 ruff==0.9.10 hypothesis==6.126.0 coverage==7.6.12 pyyaml==6.0.2 anyio==4.12.1
          pip install dist/*.whl
      # -I keeps the checkout off sys.path: the installed wheel is what runs. check --ci runs only
      # in this job (its id is the required context); each OS leg keeps Layer 1.
      - name: Run Layer 1 Deterministic Verification
        if: github.event_name != 'pull_request' || github.base_ref != 'develop'
        run: python3 -I -m aegis_cli.cli check
      - name: Run CI Governance & Regression Check
        if: github.event_name != 'pull_request' || github.base_ref != 'develop'
        run: python3 -I -m aegis_cli.cli check --ci
        env:
          GH_TOKEN: ${{ github.token }}

  # Aegis-check and verdict depend on the entire matrix. A failed shard fails
  # validate; fail-fast is off so the other shards can report their results.
  validate:
    name: validate (${{ matrix.leg.os }}, ${{ matrix.leg.python-version }}, ${{ matrix.shard }})
    if: github.event_name != 'pull_request' || github.base_ref != 'develop'
    needs: [build-wheel, dependency-audit]
    timeout-minutes: 360
    strategy:
      # One red leg must not cancel the others and hide the per-OS results.
      fail-fast: false
      matrix:
        # ubuntu-latest is Ubuntu 26.04, for which actions/setup-python has no 3.9 build; the oldest
        # supported Python keeps a Linux leg on the previous LTS image.
        leg:
          - {os: ubuntu-24.04, python-version: '3.9'}
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: macos-latest, python-version: '3.9'}
          - {os: macos-latest, python-version: '3.11'}
        shard: [unit-core-a, unit-core-b, unit-rest, integration, contract, checks]
    runs-on: ${{ matrix.leg.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.leg.python-version }}
          
      - name: Download wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aegis-wheel
          path: dist/
      
      - name: Verify artifact digests
        run: python .github/scripts/verify_dist.py verify dist

      - name: Install test dependencies
        run: |
          pip install pytest==8.3.4 pytest-xdist==3.6.1 ruff==0.9.10 hypothesis==6.126.0 coverage==7.6.12 pyyaml==6.0.2 anyio==4.12.1
          pip install dist/*.whl

      # The unit suite below runs from the checkout (pythonpath = ["."]), so on
      # its own it cannot prove the wheel works. This step runs the installed
      # wheel from outside the repo, in isolated mode, and asserts every Aegis
      # module resolves from site-packages.
      - name: Smoke-test installed wheel (source hidden)
        if: matrix.shard == 'checks'
        shell: bash
        run: |
          SMOKE="$PWD/.github/scripts/wheel_smoke.py"
          cd "$RUNNER_TEMP" && env -u PYTHONPATH python -I "$SMOKE"

      - name: Lint
        if: matrix.shard == 'checks'
        run: make lint

      - name: Run Layer 1 Deterministic Verification
        if: matrix.shard == 'checks'
        run: python3 -m aegis_cli.cli check

      - name: Install bubblewrap
        if: runner.os == 'Linux' && matrix.shard != 'checks'
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends bubblewrap

      # Same probe as tests/integration/test_hierarchy_jobs.py. The job tests skip when it fails,
      # so it runs here as a hard step. Ubuntu 23.10 and later block unprivileged user namespaces
      # through AppArmor; the sysctl lifts that for this throwaway runner.
      - name: Prove bubblewrap runs
        if: runner.os == 'Linux' && matrix.shard != 'checks'
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
