        run: |
          set -euo pipefail
          set -f
          python_bin="$VENV/bin/python"
          userbase="${PYTHONUSERBASE:-$("$python_bin" -c 'import site; print(site.getuserbase())')}"
          home="$(mktemp -d /tmp/aegis-test-home.XXXXXX)"
          trap 'rm -rf "$home"' EXIT
          xdist=""
          if "$python_bin" -c "import xdist" >/dev/null 2>&1; then
            xdist="-n auto"
          fi
          # Isolated HOME, the same contract as the developer test target. $xdist is -n auto when
          # pytest-xdist imports. Selectors are the positive paths in TEST_FAST_PATHS.
          HOME="$home" USERPROFILE="$home" XDG_CONFIG_HOME="$home/.config" PYTHONUSERBASE="$userbase" \
            "$python_bin" -m pytest -q $xdist $TEST_FAST_PATHS

      - name: Check for hardcoded paths
        run: |
          # Exclude template examples like /home/<user>/ which are privacy instructions
          if grep -rnI '/home/' rules/ skills/ docs/ README.md 2>/dev/null | grep -v '<user>' | grep -v '<username>'; then
            echo "ERROR: Hardcoded paths found"
            exit 1
          fi
          echo "No hardcoded paths found"
  test-fast-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 218
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install bubblewrap
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends bubblewrap

      # Same probe and reason as the validate job's step of the same name.
      - name: Prove bubblewrap runs
        run: |
          set -euo pipefail
