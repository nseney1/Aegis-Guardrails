name: Validate

on:
  push:
    branches: [main, develop, 'release/**', 'feature/manager-workspace-prototype']
  pull_request:
    branches: [main, develop, 'release/**']
  workflow_call:
  workflow_dispatch:
  # Nightly full matrix (CI plan, 2026-11-05). GitHub runs schedules only from the default branch's
  # copy of this file, against main's tip; develop gets the full matrix from its pushes.
  schedule:
    - cron: '17 4 * * *'

# Least privilege: every job gets a read-only token unless it grants more below.
permissions:
  contents: read

# timeout-minutes: at least twice each job's longest wall-clock time in the last 5 green runs
# (2026-10-20/21: validate 146 min on macOS 3.9, of which check --ci was about 120; aegis-check
# 27; test-windows 16; the rest under 1), never below 45 for validate and test-windows, at most
# GitHub's 360. Lower them only from new measurements: a limit must not turn a slow green run red.
# The old unsharded Windows jobs reached the 90-minute cap in runs 44710278932
# and 45089040698. In run 45089040698, 3.9 was cancelled after 5414s and 3.12
# after 5416s. The new jobs have separate ids so both required checks see each
# result. Five jobs partition the pytest suite; the language job runs wheel
# smoke, Layer 1, and language acceptance once per Python version.
# The 300-minute pytest caps and 45-minute language cap are provisional. Record
# each completed job/version's elapsed seconds including setup and its run ID.
# Keep each cap at least twice its slowest measured duration, rounded up to
# whole minutes, with a 45-minute floor. Repartition if the result exceeds 360.
# test-windows-measurement: test-windows-unit-core-a 3.9 Windows job wall clocks pending (run 45089040698 interim).
# test-windows-measurement: test-windows-unit-core-a 3.12 Windows job wall clocks pending (run 45089040698 interim).
# test-windows-measurement: test-windows-unit-core-b 3.9 Windows job wall clocks pending (run 45089040698 interim).
# test-windows-measurement: test-windows-unit-core-b 3.12 Windows job wall clocks pending (run 45089040698 interim).
# test-windows-measurement: test-windows-unit-rest 3.9 Windows job wall clocks pending (run 45089040698 interim).
# test-windows-measurement: test-windows-unit-rest 3.12 Windows job wall clocks pending (run 45089040698 interim).
# test-windows-measurement: test-windows-integration 3.9 Windows job wall clocks pending (run 45089040698 interim).
# test-windows-measurement: test-windows-integration 3.12 Windows job wall clocks pending (run 45089040698 interim).
# test-windows-measurement: test-windows-contract 3.9 Windows job wall clocks pending (run 45089040698 interim).
# test-windows-measurement: test-windows-contract 3.12 Windows job wall clocks pending (run 45089040698 interim).
# test-windows-measurement: test-windows-language 3.9 Windows job wall clocks pending (run 45089040698 interim).
# test-windows-measurement: test-windows-language 3.12 Windows job wall clocks pending (run 45089040698 interim).
# test-fast shards: run 44219204536 measured the whole suite at 6516.67s (108.6 min) on
# validate ubuntu-latest 3.11. The old single test-fast job ran that same work and the 45 min
# cap cancelled it (run 44562897709, still at 23% after 43 min). No per-shard green run exists
# yet, so each shard records that full-suite duration as its ceiling and uses timeout-minutes
# 218 (at least twice 108.6 min, at most 360). Lower a shard only after a measurement of that
# shard. The four jobs are separate ids so ALWAYS_SUCCESS names every shard: a strategy.matrix
# collapses every leg to one needs key, and a dropped leg would not be "missing" there.
# test-fast-measurement: test-fast-unit-core 6516.67s run 44219204536
# test-fast-measurement: test-fast-unit-rest 6516.67s run 44219204536
# test-fast-measurement: test-fast-integration 6516.67s run 44219204536
# test-fast-measurement: test-fast-contract 6516.67s run 44219204536
# validate: after HOSTED-CI-LD-ENV, run 45123562730 completed the four unsharded jobs
# in 11112s (Ubuntu 24.04/3.9), 11402s (Ubuntu latest/3.11), 12226s (macOS/3.9), and
# 10077s (macOS/3.11). Even the shortest exceeds half the old 300-minute cap.
# Reuse the Windows five-way pytest partition on each OS/Python pair. Keep the 360-minute
# provisional cap until the sharded jobs have completed. Replace the pending marker with one
# row per OS/Python/shard (including checks): <os> <version> <shard> <seconds>s run <id>.
# Use whole job wall clocks including setup. Keep the cap at least twice the longest recorded
# duration rounded up to minutes, with a 45-minute floor. Repartition if it would exceed 360.
# validate-measurement: pending
jobs:
  # Audits the resolved runtime dependencies declared in pyproject.toml.
  # pip-audit is a CI-only tool; it is not a project dependency.
  dependency-audit:
    if: github.event_name != 'pull_request' || github.base_ref != 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit project dependencies
        run: pip-audit --strict .

  build-wheel:
    if: github.event_name != 'pull_request' || github.base_ref != 'develop'
    needs: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token + attestations are only for the provenance attestation step.
    # When called from publish.yml, the caller job must grant these too.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install build==1.6.1
      - name: Enforce zero runtime dependencies and offline Go build
        run: |
          python .github/scripts/check_zero_dependencies.py source .
          python .github/scripts/check_zero_dependencies.py go .
      - name: Build wheel and sdist (the only build of this release)
        run: python -m build
      - name: Record artifact digests
        run: python .github/scripts/verify_dist.py record dist
      # The sdist is published too, so it is installed and smoke-tested here
      # rather than shipped untested.
      - name: Smoke-test sdist (source hidden)
        run: |
          SMOKE="$PWD/.github/scripts/wheel_smoke.py"
          SDIST="$(ls "$PWD"/dist/*.tar.gz)"
          VENV="$RUNNER_TEMP/sdist-venv"
          python -m venv "$VENV"
          "$VENV/bin/pip" install "$SDIST"
          cd "$RUNNER_TEMP" && env -u PYTHONPATH "$VENV/bin/python" -I "$SMOKE"
      # Signed SLSA build provenance for the exact bytes recorded in SHA256SUMS.
      # Skipped on pull_request: fork PRs never receive an OIDC token.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegis-wheel
          path: dist/

  # Per-PR suite, sharded by test directory (HOSTED-CI-TEST-FAST-BUDGET). The four jobs
  # together select every test file under tests/ once. Each runs on every event, wave
  # PRs into develop included. It executes the pull request's own code, so it gets the
  # read-only token only, no secrets, and a checkout that keeps no credentials. Wave PRs
  # build no wheel, so each shard installs the checkout into its own venv. The shards do
  # not need each other: they run concurrently, and aegis-check requires every one.
  test-fast-unit-core:
    runs-on: ubuntu-latest
    timeout-minutes: 218
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install bubblewrap
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends bubblewrap

      # Same probe and reason as the validate job's step of the same name.
      - name: Prove bubblewrap runs
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-net --unshare-pid --ro-bind / / --dev /dev --proc /proc true

      # The venv sits outside the checkout and outside /tmp, which the job runner's sandbox
      # replaces, so sandboxed recipes see the same pytest as the suite.
      - name: Choose the CI venv path
        run: echo "VENV=$RUNNER_TEMP/ci-venv" >> "$GITHUB_ENV"

      - name: Create the CI venv
        run: python -m venv "$VENV"

      - name: Install test dependencies into the CI venv
        run: '"$VENV/bin/pip" install pytest==8.3.4 pytest-xdist==3.6.1 ruff==0.9.10 hypothesis==6.126.0 coverage==7.6.12 pyyaml==6.0.2 anyio==4.12.1'

      - name: Install the checkout into the CI venv
        run: '"$VENV/bin/pip" install .'

      - name: Lint
        run: make lint PYTHON="$VENV/bin/python"

      - name: Run test suite
        env:
          TEST_FAST_PATHS: tests/unit/core
        run: |
          set -euo pipefail
          set -f
          python_bin="$VENV/bin/python"
          userbase="${PYTHONUSERBASE:-$("$python_bin" -c 'import site; print(site.getuserbase())')}"
          home="$(mktemp -d /tmp/aegis-test-home.XXXXXX)"
          trap 'rm -rf "$home"' EXIT
          xdist=""
          if "$python_bin" -c "import xdist" >/dev/null 2>&1; then
            xdist="-n auto"
          fi
          # Isolated HOME, the same contract as the developer test target. $xdist is -n auto when
          # pytest-xdist imports. Selectors are the positive paths in TEST_FAST_PATHS.
          HOME="$home" USERPROFILE="$home" XDG_CONFIG_HOME="$home/.config" PYTHONUSERBASE="$userbase" \
            "$python_bin" -m pytest -q $xdist $TEST_FAST_PATHS

      - name: Check for hardcoded paths
        run: |
          # Exclude template examples like /home/<user>/ which are privacy instructions
          if grep -rnI '/home/' rules/ skills/ docs/ README.md 2>/dev/null | grep -v '<user>' | grep -v '<username>'; then
            echo "ERROR: Hardcoded paths found"
            exit 1
          fi
          echo "No hardcoded paths found"

  test-fast-unit-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 218
    steps:
