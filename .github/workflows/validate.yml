          fi
          bwrap --unshare-net --unshare-pid --ro-bind / / --dev /dev --proc /proc true

      - name: Run test suite
        if: matrix.shard != 'checks'
        id: test
        shell: bash
        env:
          TEST_VALIDATE_SHARD: ${{ matrix.shard }}
          TEST_VALIDATE_UNIT_REST: tests/unit/cli tests/unit/mcp tests/unit/sdk tests/unit/verification tests/unit/test_ac24_acceptance_audit.py tests/unit/test_ac24_acquire.py tests/unit/test_changelog.py tests/unit/test_docs_claims.py tests/unit/test_docs_links.py tests/unit/test_no_real_gh.py tests/unit/test_p6_noadmin.py tests/unit/test_pypi_state.py tests/unit/test_readme.py tests/unit/test_release_guard.py
        run: |
          set -euo pipefail
          userbase="${PYTHONUSERBASE:-$(python -c 'import site; print(site.getuserbase())')}"
          home="$(mktemp -d /tmp/aegis-test-home.XXXXXX)"
          trap 'rm -rf "$home"' EXIT
          HOME="$home" USERPROFILE="$home" XDG_CONFIG_HOME="$home/.config" PYTHONUSERBASE="$userbase" python - <<'PYTHON'
          import os

          def walk_failed(_error):
              raise SystemExit("Could not enumerate validate core tests")

          shard = os.environ.get("TEST_VALIDATE_SHARD")
          if shard in ("unit-core-a", "unit-core-b"):
              # Same basename split and pytest file patterns as the Windows core shards.
              root = "tests/unit/core"
              paths = []
              if os.path.isdir(root):
                  for directory, children, files in os.walk(root, onerror=walk_failed):
                      children[:] = [name for name in children if name not in ("__pycache__", ".pytest_cache")]
                      for name in files:
                          if not (name.endswith(".py") and (name.startswith("test_") or name.endswith("_test.py"))):
                              continue
                          if (name <= "test_redaction.py") == (shard == "unit-core-a"):
                              paths.append(os.path.join(directory, name).replace(os.sep, "/"))
              paths.sort()
          elif shard == "unit-rest":
              paths = os.environ.get("TEST_VALIDATE_UNIT_REST", "").split()
          elif shard in ("integration", "contract"):
              paths = ["tests/" + shard]
          else:
              raise SystemExit("Invalid validate shard")
          if not paths:
              raise SystemExit("Validate shard has no test paths")

          # Keep the normal header for the interpreter and actual xdist worker count.
          import pytest

          raise SystemExit(pytest.main(["-n", "auto", "--durations=25", "--", *paths]))
          PYTHON

      - name: Check for hardcoded paths
        if: matrix.shard == 'checks'
        run: |
          # Exclude template examples like /home/<user>/ which are privacy instructions
          if grep -rnI '/home/' rules/ skills/ docs/ README.md 2>/dev/null | grep -v '<user>' | grep -v '<username>'; then
            echo "ERROR: Hardcoded paths found"
            exit 1
          fi
          echo "No hardcoded paths found"

